[project]
name = "ahbicht"
description = "Python Library to parse AHB expressions."
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Annika Schlögl", email = "annika.schloegl@hochfrequenz.de" },
]
keywords = ["AHB", "Parsing", "Expressions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "lark>=1.1.4",
    "pytz",
    "efoli>=2.1.0",
    "pydantic>=2"
] # add all the dependencies here
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/ahbicht/releases"
Homepage = "https://github.com/Hochfrequenz/ahbicht"
Documentation = "https://ahbicht.readthedocs.io/en/latest/"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-datafiles==3.0.1",
    "pytest-mock==3.15.1",
]
linting = ["ruff==0.16.2"]
type_check = [
    "mypy[pydantic]==2.3.0",
    "types-pytz==2026.3.1.20260727",
    { include-group = "tests" },
]
coverage = ["coverage==7.15.4", { include-group = "tests" }]
spellcheck = ["codespell==2.4.3"]
docs = ["sphinx==8.1.3", "sphinx-rtd-theme==3.1.0"]
json_schemas = []
dev = [
    "nest_asyncio",
    "pre-commit",
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "coverage" },
    { include-group = "spellcheck" },
    { include-group = "docs" },
    { include-group = "json_schemas" },
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"src/ahbicht/content_evaluation/ahb_context.py" = ["PLC0415"]
# PLC0415: import-outside-toplevel is intentional here (see the file's own comment)
# E501: a comment inside the raw GRAMMAR string exceeds the line length and can't be noqa'd (interior to a string)
"src/ahbicht/expressions/condition_expression_parser.py" = ["PLC0415", "E501"]
# lark Transformer methods must match the grammar's (uppercase) terminal/rule names exactly
"src/ahbicht/expressions/ahb_expression_evaluation.py" = ["N802"]
"src/ahbicht/expressions/expression_resolver.py" = ["N802"]

[tool.pytest.ini_options]
# When the mode is auto, all discovered async tests are considered asyncio-driven
# even if they have no @pytest.mark.asyncio marker.
# https://github.com/pytest-dev/pytest-asyncio#auto-mode
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["datafiles"]

[tool.mypy]
strict = true

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"


[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"
fragments = [{ path = "README.rst" }]

[tool.hatch.version]
source = "vcs"


[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
